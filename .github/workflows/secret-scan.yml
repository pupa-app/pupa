name: Secret scan

# gitleaks over the full history, plus the pre-commit hook's own fixture suite.
#
# The hook is advisory: anyone can `git commit --no-verify`, and a contributor
# who never runs `make` never installs it. This job is the part that actually
# enforces — it runs on every PR, including from forks, and cannot be bypassed.
#
# Same triggers as Tests: while a PR into dev/main is open, and when commits
# land on dev or main. Ubuntu rather than macOS: nothing here needs Xcode.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this job never needs to write to the repo, and a public repo's
# workflow token is worth keeping as small as possible.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      # Pinned, with the checksum, rather than a floating action: this step
      # runs on pull_request from forks. Bump both together — nothing updates
      # them automatically, since it is a release download and not an action.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A secret added and then reverted inside the same PR is still in the
          # objects; a shallow clone would not see it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan all history
        # --redact so a finding never prints the secret into a public log.
        # Config is .gitleaks.toml at the root: default credential rules plus
        # this repo's personal-email and /Users-path rules.
        run: gitleaks git --log-opts=--all --redact --no-banner

      - name: Hook fixture suite
        # The guards the hook applies locally, asserted here too — so a change
        # that quietly stops the hook refusing shows up as a red PR.
        run: ./scripts/test-hooks.sh
