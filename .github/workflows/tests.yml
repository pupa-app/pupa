name: Tests

# Build + test both Swift packages (AGUIKit and the Pupa app) on macOS,
# matching the local `make test` flow documented in CONTRIBUTING.md.
#
# Runs only when it matters:
#   - pull_request: while a PR into dev/main is open (on open + each new commit).
#   - push:         when commits actually land on dev or main.
# A push to a feature branch with no open PR matches neither, so it won't run.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    # macos-26 ships Xcode 26 / Swift 6.3, matching the toolchain the project
    # is built with. The older macos-15 image (Swift 6.1.2) crashes the
    # compiler ("error: fatalError") while building the Pupa test target.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            AGUIKit/.build
            Pupa/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run tests
        run: make test
